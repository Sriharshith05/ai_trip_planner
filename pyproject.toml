[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "msh_intro", email = "sriharshithmamidala5@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-community[places]>=5.0.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
ai-trip-planner = "ai_trip_planner:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
